<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weatherly | Weather App</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Background Clouds -->
    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>
    <div class="cloud cloud3">☁️</div>

    <div class="main">

        <div class="weather-card">

            <!-- Header -->
            <div class="header">
                <div class="logo">
                    🌤️
                </div>

                <div>
                    <h1>Weatherly</h1>
                    <p>Weather made simple</p>
                </div>
            </div>

            <!-- Search -->
            <div class="search-box">

                <input
                    type="text"
                    id="city"
                    placeholder="Search your city..."
                >

                <button onclick="searchWeather()">
                    🔍
                </button>

            </div>

            <p id="error"></p>

            <!-- Location -->
            <div class="location">

                <h2 id="cityName">Chennai</h2>

                <p id="date">
                    Tuesday, September 15
                </p>

            </div>

            <!-- Main Weather -->
            <div class="main-weather">

                <div class="weather-icon" id="icon">
                    ☀️
                </div>

                <div class="temperature">
                    <span id="temp">32</span><sup>°C</sup>
                </div>

                <div class="condition" id="condition">
                    Sunny
                </div>

            </div>

            <!-- Weather Details -->
            <div class="details">

                <div class="detail-card">

                    <div class="detail-icon">
                        💧
                    </div>

                    <div>
                        <p>Humidity</p>
                        <h3 id="humidity">65%</h3>
                    </div>

                </div>


                <div class="detail-card">

                    <div class="detail-icon">
                        💨
                    </div>

                    <div>
                        <p>Wind Speed</p>
                        <h3 id="wind">4.5 m/s</h3>
                    </div>

                </div>


                <div class="detail-card">

                    <div class="detail-icon">
                        🌡️
                    </div>

                    <div>
                        <p>Feels Like</p>
                        <h3 id="feels">35°C</h3>
                    </div>

                </div>

            </div>

            <!-- Footer -->
            <div class="footer">
                <span>🌎</span>
                Stay updated with the weather
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
